<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="drawdown">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="icon" type="image/png" href="assets/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<title>drawdown</title>
<style>
:root{
  /* layout: native iOS feel. Large titles, inset grouped lists, a ring timer with pour bars, and one floating orange action above a blurred tab bar. Single dark theme by choice. */
  --bg:#000000; --grp:#1C1C1E; --grp2:#2C2C2E; --grp3:#3A3A3C; --sep:rgba(84,84,88,.6);
  --label:#FFFFFF; --sec:rgba(235,235,245,.6); --ter:rgba(235,235,245,.3);
  --accent:#FF9F0A; --accent-dim:rgba(255,159,10,.16);
  --water:#5B8FE0; --water-deep:#2B4A7A; --water-done:rgba(91,143,224,.3);
  --red:#FF453A; --green:#32D74B;
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  --display:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overscroll-behavior:none}
html{-webkit-text-size-adjust:100%}
button,a,nav a,.pill,.btn,.cell,.picker,.seg button,.pick button,.rating button{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#sheet-body{overscroll-behavior:contain}
body{background:var(--bg);color:var(--label);font:17px/1.35 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
svg{display:block}

main{max-width:600px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 100px);display:flex;flex-direction:column;gap:8px}
main.has-dock{padding-bottom:calc(env(safe-area-inset-bottom) + 170px)}
.lt{font:700 34px/1.1 var(--display);letter-spacing:.005em;margin:28px 4px 8px;text-wrap:balance}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;padding:18px 16px 6px;font-size:13px;text-transform:uppercase;letter-spacing:.02em;color:var(--sec)}
.foot{font-size:13px;color:var(--sec);padding:6px 16px 0;margin:0}
.link{appearance:none;background:none;border:0;color:var(--accent);padding:4px 0;font-size:inherit;text-transform:none;letter-spacing:0}
.link.center{align-self:center;font-size:15px;padding:16px}

/* grouped lists */
.grp{background:var(--grp);border-radius:12px;overflow:hidden}
.cell{display:flex;align-items:center;gap:12px;min-height:44px;padding:10px 16px;position:relative;width:100%;background:none;border:0;text-align:left}
.cell + .cell::before,.cell + .cellw::before,.cellw + .cell::before,.cellw + .cellw::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.cellw{display:flex;align-items:center;position:relative}
.cellw .cell{flex:1;min-width:0}
.c-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.c-title{font-size:17px;overflow-wrap:anywhere}
.c-sub{font-size:14px;color:var(--sec);overflow-wrap:anywhere}
.c-val{color:var(--sec);font-size:17px;white-space:nowrap}
.chev{width:8px;height:13px;color:var(--ter);flex:none}
.thumb{width:44px;height:44px;border-radius:9px;object-fit:cover;flex:none;background:var(--grp2)}
.thumb.ph{display:flex;align-items:center;justify-content:center;color:var(--accent);font:600 18px var(--display)}
.check{width:18px;height:18px;color:var(--accent);flex:none}
.acc{color:var(--accent)}
.again{appearance:none;border:0;background:var(--accent-dim);color:var(--accent);font-size:14px;font-weight:600;border-radius:99px;padding:6px 12px;margin-right:12px;flex:none}
.stars{color:var(--accent);font-size:13px;letter-spacing:1px;white-space:nowrap}
.stars .off{color:var(--grp3)}
.empty{color:var(--sec);text-align:center;padding:28px 20px;font-size:15px;line-height:1.45}

/* brew screen */
.brew-head{display:flex;flex-direction:column;gap:2px;margin:20px 4px 0}
.eyebrow{font-size:13px;color:var(--sec);font-weight:500}
.picker{position:relative;display:inline-flex;align-items:center;gap:6px;max-width:100%}
.picker select{position:absolute;inset:0;opacity:0;width:100%;font-size:16px}
.picker.big span{font:700 30px/1.15 var(--display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.picker.small{font-size:15px;color:var(--sec)}
.picker.small b{color:var(--label);font-weight:500;max-width:62vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.picker svg{width:12px;height:12px;color:var(--accent);flex:none}
.ring-wrap{position:relative;width:min(78vw,290px);aspect-ratio:1;margin:18px auto 6px}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.clock{font:200 64px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.clock small{font-size:32px;color:var(--sec)}
.ring-sub{font-size:14px;color:var(--sec)}
.step{text-align:center;font-size:17px;margin:4px 24px 0;min-height:70px;text-wrap:balance;display:flex;flex-direction:column;align-items:center;gap:4px}
#step-sub{font-size:15px;color:var(--sec)}
#step-main.in{animation:stepin .5s var(--spring-soft)}
@keyframes stepin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.step b{color:var(--water);font-weight:600}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr)}
.rgrid > div{padding:11px 14px;border-right:.5px solid var(--sep);border-bottom:.5px solid var(--sep)}
.rgrid > div:nth-child(3n){border-right:0}
.rgrid > div:nth-last-child(-n+3){border-bottom:0}
.rgrid small{display:block;font-size:12px;color:var(--sec)}
.rgrid span{font:500 21px/1.3 var(--display);font-variant-numeric:tabular-nums}
.rgrid span i{font-style:normal;font-size:14px;color:var(--sec);margin-left:2px}
.pours{padding:6px 16px 12px;display:flex;flex-direction:column;gap:10px}
.pour-top{display:flex;justify-content:space-between;font-size:12px;color:var(--sec);margin-bottom:4px}
.pour-top b{font-weight:500;color:var(--label)}
.bar{height:22px;border-radius:5px;background:var(--water-deep);position:relative;overflow:hidden;transform-origin:left center;transition:opacity .5s var(--ease),transform .4s var(--spring-soft)}
.fill{position:absolute;inset:0;background:var(--water);transform:scaleX(0);transform-origin:left center;border-radius:inherit;transition:transform .7s var(--spring-soft)}
body.timing .fill{transition:none}
.pour.now .bar{transform:scaleY(1.1)}
.pour.done .bar{opacity:.42}
.pour-top b{transition:color .4s var(--ease)}
.pour.now .pour-top b{color:var(--water)}
.pour.done .pour-top b{color:var(--sec)}
.tip{padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.tip strong{font-weight:600}
.tip ul{margin:0;padding-left:18px;color:var(--sec);font-size:15px}
.tip ul li::marker{color:var(--accent)}

/* dock + tab bar */
#dock{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 64px);z-index:7;padding:0 16px 12px;display:flex;gap:10px;max-width:600px;margin:0 auto;background:linear-gradient(transparent,var(--bg) 40%)}
.pill{appearance:none;border:0;border-radius:99px;min-height:56px;padding:0 22px;font:600 19px var(--font);display:flex;align-items:center;justify-content:center;gap:10px;flex:1}
.pill svg{width:20px;height:20px}
.pill.go{background:var(--accent);color:#1A0F00}
.pill.ghost{background:var(--grp2);color:var(--label);flex:0 0 auto}
nav{position:fixed;left:0;right:0;bottom:0;z-index:8;background:rgba(18,18,20,.82);-webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);border-top:.5px solid var(--sep);display:grid;grid-template-columns:repeat(2,1fr);padding:6px 0 calc(env(safe-area-inset-bottom) + 4px)}
nav a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:500;color:#8E8E93;text-decoration:none;padding:2px 0}
nav a svg{width:26px;height:26px}
nav a[aria-current="page"]{color:var(--accent)}

/* journal */
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--grp);border-radius:9px;padding:2px;margin:4px 0 8px}
.seg-thumb{position:absolute;top:2px;bottom:2px;left:2px;width:calc(50% - 2px);border-radius:7px;background:var(--grp3);box-shadow:0 3px 8px rgba(0,0,0,.35),0 0 0 .5px rgba(255,255,255,.04);transition:transform var(--t-snappy) var(--spring-soft)}
.seg[data-on="top"] .seg-thumb{transform:translateX(100%)}
.seg button{position:relative;z-index:1;appearance:none;border:0;background:none;border-radius:7px;padding:6px;font-size:14px;font-weight:500;color:var(--sec)}
.seg button[aria-selected="true"]{color:var(--label);font-weight:600}
#jbody{display:flex;flex-direction:column;gap:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr)}
.stats > div{padding:12px 14px;border-right:.5px solid var(--sep)}
.stats > div:last-child{border-right:0}
.stats b{display:block;font:600 28px/1.15 var(--display);font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--sec)}

/* beans */
.scan{appearance:none;border:0;width:100%;border-radius:14px;background:var(--grp);padding:18px 16px;display:flex;gap:14px;align-items:center;text-align:left}
.scan .ico{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#1A0F00;display:flex;align-items:center;justify-content:center;flex:none}
.scan .ico svg{width:22px;height:22px}

/* sheet */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20}
#sheet{position:fixed;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top) + 26px);z-index:21;background:var(--grp);border-radius:12px 12px 0 0;display:flex;flex-direction:column;max-width:600px;margin:0 auto}
.sheet-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 16px 10px;gap:8px}
.sheet-head h2{font:600 17px var(--font);margin:0;text-align:center}
.sheet-head .link{font-size:17px}
#sheet-save{justify-self:end;font-weight:600}
#sheet-close{justify-self:start}
#sheet-body{overflow:auto;padding:4px 16px calc(env(safe-area-inset-bottom) + 28px);display:flex;flex-direction:column;gap:6px;-webkit-overflow-scrolling:touch}
#sheet .grp{background:var(--grp2)}
/* a scrolling flex column shrinks overflow:hidden children to fit instead of scrolling: never let them shrink */
#sheet-body{flex:1 1 auto;min-height:0}
#sheet-body > *{flex-shrink:0}
#sheet .rgrid > div,#sheet .stats > div{border-color:rgba(84,84,88,.45)}
.hero{width:100%;max-height:300px;object-fit:cover;border-radius:12px;background:var(--grp2)}
.d-title{font:700 28px/1.15 var(--display);margin:12px 4px 0;text-wrap:balance}
.d-sub{color:var(--sec);margin:2px 4px 0;font-size:15px}
.err{font-size:15px;color:#FFB3AE;background:rgba(255,69,58,.15);border-radius:10px;padding:10px 14px;margin:4px 0}
.note{font-size:15px;color:var(--sec);margin:0}
.btn-row{display:flex;gap:8px;margin-top:8px}
.btn{appearance:none;border:0;border-radius:12px;min-height:50px;padding:0 16px;font-weight:600;font-size:17px;flex:1;background:var(--grp2);color:var(--label)}
.btn.go{background:var(--accent);color:#1A0F00}
.btn.red{color:var(--red)}
.btn:disabled{opacity:.4}

/* form rows */
.frow{display:flex;align-items:center;gap:12px;min-height:44px;padding:6px 16px;position:relative}
.frow label{flex:none;min-width:96px}
.frow input,.frow select{flex:1;min-width:0;text-align:right;background:none;border:0;font-size:17px;color:var(--sec);padding:6px 0;-webkit-appearance:none;appearance:none}
.frow select{direction:rtl}
.frow input:focus{color:var(--label);outline:none}
.frow input::placeholder{color:var(--ter)}
.frow + .frow::before,.frow + .srow::before,.srow + .frow::before,.srow + .srow::before,.ta::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.ta{position:relative;padding:10px 16px}
.ta textarea{width:100%;min-height:84px;background:none;border:0;font-size:17px;resize:vertical;color:var(--label);padding:0}
.ta textarea:focus{outline:none}
.ta textarea::placeholder{color:var(--ter)}
.srow{padding:10px 16px 12px;position:relative}
.srow-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.srow-top output{font-variant-numeric:tabular-nums;color:var(--sec)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--accent) var(--p,50%),var(--grp3) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;margin-top:-12px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--grp3)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border:0;border-radius:50%;background:#fff}
.ratio-line{font-size:13px;color:var(--sec);padding:6px 16px 0}
.gwrap{position:relative}
#sheet .seg{background:var(--grp2)}
#sheet .seg-thumb{background:#5A5A5E}
.gwrap::before,.gwrap + .srow::before,.gwrap + .frow::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.gwrap.swapin,.swapin{animation:fadein .4s var(--spring-soft)}
.zone{position:relative;height:4px;margin:8px 14px 0;border-radius:2px;background:rgba(91,143,224,.12)}
.zone span{position:absolute;top:0;bottom:0;border-radius:2px;background:var(--water);opacity:.75}
.ghint{font-size:12px;color:var(--sec);margin-top:6px}
.ratio-line b{color:var(--accent);font-weight:600}
.rating{display:flex;gap:2px;padding:6px 12px}
.rating button{appearance:none;border:0;background:none;font-size:32px;line-height:1;color:var(--grp3);padding:2px 4px}
.rating button.on{color:var(--accent)}
.pick{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px}
.pick button{appearance:none;border:0;background:var(--grp3);border-radius:99px;padding:7px 13px;font-size:15px;color:var(--label)}
.pick button.on{background:var(--accent);color:#1A0F00;font-weight:600}
.dgrid{display:grid;grid-template-columns:1fr 1fr}
.dgrid > div{padding:10px 16px;border-bottom:.5px solid var(--sep)}
.dgrid > div:nth-child(odd){border-right:.5px solid var(--sep)}
.dgrid small{display:block;font-size:12px;color:var(--sec)}
.dgrid span{font-size:17px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:6px;padding:12px 16px 0}
.tag{font-size:13px;padding:3px 10px;border-radius:99px;background:var(--grp3);color:var(--sec)}
.spin{display:inline-block;width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}

/* Allo by Josh Puckett (SIL Open Font License), variable 100–900, via the allo-font npm package */
@font-face{font-family:Allo;src:url("https://cdn.jsdelivr.net/npm/allo-font@1.0.1/fonts/webfonts/AlloVariable.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
.gimg{display:block;object-fit:contain;flex:none}
.lt-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.lt-row .lt{margin-right:0}
.iconbtn{appearance:none;background:transparent;border:0;color:var(--sec);width:44px;height:44px;margin:0 0 6px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px var(--sep);transition:color .3s var(--ease),transform .4s var(--spring-soft)}
.iconbtn svg{width:20px;height:20px}
.iconbtn:active{transform:scale(.97);transition-duration:.1s;color:var(--label)}
.gprev{display:flex;justify-content:center;padding:6px 0 0;min-height:0}
.gprev .gimg{width:132px;height:132px}
.brew-head{position:relative;padding-right:64px}
.brew-gimg{position:absolute;right:-8px;top:4px;width:72px;height:72px}
.thumb-g{width:48px;height:48px;background:#121212}
#sheet .thumb-g{background:#1c1c1c}
/* ---------- beans detail · Label (v1.8, picked from prototypes) ---------- */
.bk-hero{position:relative;margin:-4px -16px 0}
.bk-hero img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:0}
.bk-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 45%,#000)}
.bk-name{position:relative;z-index:1;padding:0 4px;margin:6px 0 4px}
.bk-hero + .bk-name{margin-top:-58px}
.bk-name h2{margin:0;font:italic 400 58px/.95 var(--serif);letter-spacing:-.02em;text-wrap:balance}
.bk-name p{color:var(--sec);margin:8px 0 0;font-size:15px}
.bk-key{background:var(--grp);padding:14px 16px 16px;margin-top:14px}
.bk-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.bk-h .cap{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--sec)}
.bk-h .src{flex:1;font-size:13px;color:var(--sec)}
.bk-h u{text-decoration:none;font:13px var(--mono);color:var(--label);white-space:nowrap}
.bk-h u.z{color:var(--ter)}
.bk-tabs button,.bk-seg button,.bk-chips button,.bk-f{appearance:none;-webkit-appearance:none;border:0;border-radius:0;background:none}
.bk-tabs,.bk-seg{display:grid;gap:2px;background:var(--grp2);padding:2px}
.bk-tabs{grid-template-columns:repeat(3,1fr)}
.bk-seg{grid-template-columns:repeat(4,1fr)}
.bk-tabs button{min-height:48px;font-size:17px;color:var(--sec)}
.bk-seg button{min-height:40px;font-size:14px;color:var(--sec);padding:0 2px}
.bk-tabs button.on,.bk-seg button.on{background:var(--label);color:#000}
.bk-tabs.g button.on{background:transparent;color:var(--label);box-shadow:inset 0 0 0 1.5px var(--label);outline:1px dashed var(--label);outline-offset:-6px}
.bk-tabs button:active,.bk-seg button:active,.bk-f:active,.bk-chips button:active{transform:scale(.97)}
.bk-gap{height:16px}
.bk-note{font-size:13px;color:var(--sec);margin:12px 0 0}
.bk-card{margin-top:2px;background:var(--label);color:#000;padding:2px}
.bk-grid{display:grid;grid-template-columns:1fr 1fr}
.bk-f{min-height:74px;padding:12px 12px 10px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:6px;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.35);color:#000;background:none;font:inherit}
.bk-f.wide{grid-column:1 / -1}
.bk-f small{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#5c5a55}
.bk-f span{font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.bk-f.none span{color:#8c8a84}
.bk-f.on{outline:1.5px solid #000;outline-offset:-6px}
.bk-code{display:flex;flex-direction:column;gap:8px;padding:14px 12px;background:#000;color:var(--label)}
.bk-code .cap{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--sec)}
.bk-code b{font:500 22px/1 var(--mono);letter-spacing:-.02em;white-space:nowrap;display:inline-block}
.bk-why{margin:16px 4px 4px;padding:0;font:italic 400 21px/1.25 var(--serif);color:var(--label)}
.bk-why em{display:block;font:400 13px/1.35 var(--font);color:var(--sec);margin-top:8px}
.bk-edit{background:var(--grp);padding:14px 16px 16px;margin-top:2px}
.bk-edit input{display:block;width:100%;min-height:52px;padding:0 14px;background:#000;color:var(--label);border:0;border-radius:0;box-shadow:inset 0 0 0 1.5px var(--label);font:400 17px var(--font);outline:none;-webkit-appearance:none}
.bk-edit input::placeholder{color:var(--ter)}
.bk-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}

  --spring-soft:var(--ease); --spring-bounce:cubic-bezier(.34,1.32,.64,1); --spring-snappy:var(--ease);

    --spring-bounce:linear(0, 0.0203, 0.073, 0.1476, 0.2354, 0.3297, 0.425, 0.5174, 0.6041, 0.6833, 0.7538, 0.8153, 0.8678, 0.9115, 0.9472, 0.9755, 0.9973, 1.0135, 1.0249, 1.0323, 1.0366, 1.0383, 1.0381, 1.0365, 1.0338, 1.0306, 1.0271, 1.0234, 1.0198, 1.0164, 1.0132, 1.0104, 1.0079, 1.0058, 1.004, 1.0025, 1);
    --spring-snappy:linear(0, 0.0238, 0.0839, 0.1659, 0.2593, 0.3562, 0.4513, 0.5408, 0.6224, 0.6951, 0.7584, 0.8124, 0.8577, 0.895, 0.9252, 0.9492, 0.9678, 0.982, 0.9924, 0.9999, 1.005, 1.0083, 1.0102, 1.011, 1.0111, 1.0106, 1.0098, 1.0088, 1.0078, 1.0067, 1.0057, 1.0047, 1.0038, 1.0031, 1.0024, 1.0019, 1);

/* press: quick squeeze down, spring back on release */
.pill,.btn,.again,.scan,.pick button,.rating button,.seg button{transition:transform .4s var(--spring-soft),background-color .3s var(--ease),color .3s var(--ease),opacity .3s var(--ease)}
.pill:active,.btn:active,.again:active,.scan:active,.pick button:active,.seg button:active{transform:scale(.97);transition-duration:.1s;transition-timing-function:ease-out}
.link,.picker{transition:opacity .35s var(--ease)}
.link:active,.picker:active{opacity:.45;transition-duration:.06s}
.cell{transition:background-color .4s var(--ease)}
.cell:active{background-color:rgba(255,255,255,.09);transition-duration:0s}
nav a{transition:color .3s var(--ease)}
nav a svg{transition:transform .4s var(--spring-soft)}
nav a:active svg{transform:scale(.9);transition-duration:.1s;transition-timing-function:ease-out}
nav a.pop svg{animation:pop var(--t-snappy) var(--spring-soft)}
@keyframes pop{from{transform:scale(.88)}to{transform:scale(1)}}
.rating button.pop{animation:starpop var(--t-snappy) var(--spring-soft)}
@keyframes starpop{from{transform:scale(1.25)}to{transform:none}}
input[type=range]::-webkit-slider-thumb{transition:transform .35s var(--spring-bounce)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.12)}

/* tab change: content rises in, staggered */
main.enter > *{animation:enter var(--t-soft) var(--spring-soft) both}
main.enter > *:nth-child(2){animation-delay:.025s} main.enter > *:nth-child(3){animation-delay:.05s}
main.enter > *:nth-child(4){animation-delay:.075s} main.enter > *:nth-child(5){animation-delay:.1s}
main.enter > *:nth-child(6){animation-delay:.12s} main.enter > *:nth-child(n+7){animation-delay:.14s}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* sheet: slides up on a spring, page recedes behind it, drag down to close */
.sheet-top{touch-action:pan-x;cursor:grab;flex:none}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--grp3);margin:7px auto 0}
.sheet-head{padding-top:8px}

#sheet.dragging,#scrim.dragging{transition:none}

#scrim.open{opacity:1}

.clock{transition:opacity .45s var(--ease)}
.clock.paused{opacity:.55}

/* dock buttons spring in when they change */
#dock{transition:transform var(--t-soft) var(--spring-soft),opacity .35s var(--ease)}
#dock.away{transform:translateY(30px);opacity:0;pointer-events:none}
body.sheet-up #dock{opacity:0;pointer-events:none}

#dock .pill.ghost{animation-name:ghostin}

  #sheet,#sheet.open,body.sheet-up #view,#dock.away{transform:none!important}
  #sheet{opacity:0}
  #sheet.open{opacity:1}
}
/* ---------- sliders (DialKit port) ----------
   one rhythm: 52 px rows, 8 px apart, nothing in between. Track and pull are softly rounded (the one
   exception to the square brand), the pull floats 3 px inside the track with a lit top edge. */
.dk-src{display:none}

  box-shadow:inset 0 1px 0 rgba(255,255,255,.09),inset 0 -1px 0 rgba(0,0,0,.25),0 1px 3px rgba(0,0,0,.45);transition:background .2s,box-shadow .2s}

.fl-tip strong{display:block;font-weight:400;margin-top:6px}
.fl-tip ul{margin:8px 0 0;padding-left:18px;color:var(--sec);font-size:14px;font-weight:300}
.fl-kvs{border-top:1px solid var(--grp3)}
.fl-kv{display:flex;justify-content:space-between;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--grp3)}
.fl-kv span{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--sec)}
.fl-kv b{font-weight:300;font-size:17px;font-variant-numeric:tabular-nums}
.fl-step .rating{padding:0 0 14px;gap:6px}
.fl-step .rating button{padding:0;font-size:34px}
.fl-step .pick{padding:0}
.fl-notes{display:block;width:100%;min-height:76px;margin-top:16px;background:var(--grp);border:0;border-radius:0;color:var(--label);font:300 16px/1.4 var(--font);padding:12px 14px;resize:vertical}
.fl-notes::placeholder{color:var(--ter)}
/* hero timer */
.h-t{display:flex;height:1em;line-height:1}
.rc{display:inline-block;height:1em;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(transparent,#000 14%,#000 86%,transparent)}
.rc-s{display:flex;flex-direction:column;transition:transform .55s var(--spring-snappy);will-change:transform}
.rc-s i{display:block;height:1em;font-style:normal;text-align:center}
.rc-x{display:inline-block;height:1em}
@media (prefers-reduced-motion:reduce){.rc-s{transition:none}}

.h-t{font:400 104px/1 var(--mono);letter-spacing:-.05em;margin:14px 0 0 -6px;font-variant-numeric:tabular-nums;display:flex;height:1em}
.h-s{font:italic 400 38px/1.02 var(--serif);letter-spacing:-.01em;margin-top:22px}
.h-u{font-size:14px;color:var(--sec);font-weight:300;margin-top:8px;min-height:20px}
.h-track{position:relative;height:10px;background:var(--grp3);margin-top:30px;overflow:hidden}
.h-track i{position:absolute;inset:0;background:var(--label);transform-origin:left;transform:scaleX(0)}
.h-track b{position:absolute;top:0;bottom:0;width:3px;margin-left:-1px;background:var(--bg)}
.h-marks{position:relative;height:18px;margin-top:8px}
.h-marks span{position:absolute;top:0;font:11px var(--mono);color:var(--ter);transition:color .2s ease-out}
.h-marks span.past{color:var(--sec)}
.h-marks span.cur{color:var(--label)}
.h-next{display:flex;justify-content:space-between;border-top:1px solid var(--sep);margin-top:18px;padding-top:14px;font-size:13px;color:var(--sec);font-weight:300}
.h-next span:last-child{color:var(--label)}
@keyframes hIn{from{opacity:0;transform:translateY(10px);filter:blur(3px)}to{opacity:1;transform:none;filter:blur(0)}}
.h-s.swap,.h-u.swap,.h-next.swap span:last-child{animation:hIn .52s var(--spring-soft) both}
.h-u.swap{animation-delay:60ms}
.h-next.swap span:last-child{animation-delay:110ms}
.fl-opt,.fl-btn,.fl-edit,.fl-sh{transition:transform .1s ease-out,opacity .15s ease-out}
.fl-opt:active,.fl-btn:active,.fl-sh[data-act]:active{transform:scale(.97)}
.fl-opt,.fl-btn,.fl-edit,.fl-sh,.fl-links .link{touch-action:manipulation;-webkit-user-select:none;user-select:none}
@media (prefers-reduced-motion:reduce){.fl-body.rise{animation:flfade .2s ease-out both}.h-s.swap,.h-u.swap,.h-next.swap span:last-child{animation:none}}
@keyframes flfade{from{opacity:0}to{opacity:1}}
</style>

<body>
<main id="view"></main>
<div id="dock" class="away"></div>

<header id="hdr"><div id="hdr-in"><div class="titles" role="tablist" aria-label="Screens">
  <span class="tw"><button class="ttab" id="tab0" role="tab" aria-controls="view">Next cup</button></span><span class="tw"><button class="ttab" id="tab1" role="tab" aria-controls="jr">Journal</button></span><span class="ind"><b></b></span></div>
  <button class="iconbtn jbtn" id="set-btn" data-act="settings" aria-label="Settings and version"></button></div><i id="hdr-hl"></i></header>
<div id="jr" aria-hidden="true" role="tabpanel" aria-labelledby="tab1"><div id="jr-scroll"><main id="jrv"></main></div></div>

<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="pick" accept="image/*" hidden>
<div id="scrim" hidden></div>
<section id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="sheet-top" id="sheet-top"><div class="grabber" aria-hidden="true"></div>
  <div class="sheet-head"><button class="link" id="sheet-close">Close</button><h2 id="sheet-title"></h2><button class="link" id="sheet-save" type="submit" hidden>Save</button></div></div>
  <div id="sheet-body"></div>
</section>

<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newId = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : null; };
const use = n => (window.claude && window.claude.use) ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
const TAGS = ['sweet','balanced','fruity','floral','chocolatey','juicy','sour','bitter','astringent','thin','heavy','muddy'];
const ROASTS = ['light','medium-light','medium','medium-dark','dark'];
const I = {
  chev:'<svg class="chev" viewBox="0 0 8 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m1.5 1.5 5 5-5 5"/></svg>',
  down:'<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2.5 4.5 3.5 3.5 3.5-3.5"/></svg>',
  play:'<svg viewBox="0 0 20 20" fill="currentColor"><path d="M6 3.8v12.4c0 .8.9 1.3 1.6.8l9.3-6.2c.6-.4.6-1.2 0-1.6L7.6 3c-.7-.5-1.6 0-1.6.8z"/></svg>',
  stop:'<svg viewBox="0 0 20 20" fill="currentColor"><rect x="4" y="4" width="12" height="12" rx="2.5"/></svg>',
  reset:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10a6.5 6.5 0 1 0 2-4.7M3.5 3v3.5H7"/></svg>',
  cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 8.5A2 2 0 0 1 5 6.5h2.2l1.6-2h6.4l1.6 2H19a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.8"/></svg>',
  check:'<svg class="check" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9.5 4 4 8-9"/></svg>'
};

function fmtTime(sec){ if(sec == null || isNaN(sec)) return '–'; sec = Math.round(sec); return Math.floor(sec/60) + ':' + String(sec%60).padStart(2,'0'); }
function parseTime(v){
  if(typeof v === 'number') return v;
  v = String(v ?? '').trim(); if(!v) return null;
  const m = v.match(/^(\d+)[:.,](\d{1,2})$/); if(m) return (+m[1])*60 + (+m[2]);
  const n = num(v); if(n == null) return null; return n < 15 ? Math.round(n*60) : Math.round(n);
}
function fmtDate(iso){ try{ return new Date(iso).toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }catch(e){ return iso; } }
function localDT(d = new Date()){ const p = n => String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; }
function ratio(dose, water){ return dose && water ? '1:' + (water/dose).toFixed(1) : '–'; }
function stars(r){ r = Math.round(r || 0); let s = ''; for(let i=1;i<=5;i++) s += i <= r ? '★' : '<span class="off">★</span>'; return `<span class="stars" aria-label="${r} of 5">${s}</span>`; }
function daysOff(d){ if(!d) return null; const t = new Date(d); if(isNaN(t)) return null; return Math.floor((Date.now() - t) / 864e5); }

/* ---------- state + storage ---------- */
const S = { setups:[], beans:[], brews:[], prefs:{ id:'prefs', kind:'prefs', setupId:null, plan:null } };
let store = null, loaded = false;

function ingest(docs){
  S.setups = []; S.beans = []; S.brews = [];
  for(const d of docs){
    if(d.kind === 'setup') S.setups.push(d);
    else if(d.kind === 'bean') S.beans.push(d);
    else if(d.kind === 'brew') S.brews.push(d);
    else if(d.kind === 'prefs') S.prefs = d;
  }
  S.brews.sort((a,b) => (b.date||'').localeCompare(a.date||''));
  S.beans.sort((a,b) => (b.created||0) - (a.created||0));
  S.setups.sort((a,b) => (a.created||0) - (b.created||0));
  const first = !loaded; loaded = true; render(); if(first){ animateEnter(); setTimeout(backfillPalettes, 800); }
}
function allDocs(){ return [...S.setups, ...S.beans, ...S.brews, S.prefs]; }
function localStore(){
  let all = {};
  try { all = JSON.parse(localStorage.getItem('brewlog-v1') || '{}'); } catch(e){}
  const persist = () => { try { localStorage.setItem('brewlog-v1', JSON.stringify(all)); } catch(e){} };
  return { mode:'local', start(){ ingest(Object.values(all)); }, async put(o){ all[o.id] = o; persist(); }, async del(id){ delete all[id]; persist(); } };
}
function readSnap(snap){
  const arr = Array.isArray(snap) ? snap : (snap && snap.docs) || [];
  return arr.map(d => { const data = typeof d.data === 'function' ? d.data() : (d.data ?? d); return { ...data, id: d.id ?? data.id }; });
}
async function cloudStore(db, user){
  const uid = await user.id(); if(!uid) return null;
  const col = db.collection('data/users/' + uid);
  return {
    mode:'cloud',
    start(){ col.onSnapshot(snap => { if(!fellBack){ clearTimeout(loadTimer); syncState = 'cloud'; ingest(readSnap(snap)); } },
                            () => { if(!loaded) fallBack('Couldn’t load your synced data. Saving on this device for now.'); }); },
    put(o){ return col.doc(o.id).set(o); },
    del(id){ return col.doc(id).delete(); }
  };
}
async function save(o){
  const key = o.kind === 'setup' ? 'setups' : o.kind === 'bean' ? 'beans' : o.kind === 'brew' ? 'brews' : null;
  if(key){ const i = S[key].findIndex(x => x.id === o.id); if(i >= 0) S[key][i] = o; else S[key].unshift(o); }
  else if(o.kind === 'prefs') S.prefs = o;
  ingest(allDocs());
  try { await store.put(o); } catch(e){ toastErr('Couldn’t save that change. Check your connection and try again.'); }
}
async function remove(kind, id){
  const key = kind + 's'; S[key] = S[key].filter(x => x.id !== id);
  ingest(allDocs());
  try { await store.del(id); } catch(e){ toastErr('Couldn’t delete that. Try again.'); }
}
let fellBack = false, loadTimer = null, bootNote = '', syncState = 'loading';
function fallBack(msg){ if(fellBack) return; fellBack = true; bootNote = msg || ''; syncState = 'local'; store = localStore(); store.start(); }

/* ---------- account: Supabase sign-in, sync and AI (web version) ----------
   No library: Google sign-in with PKCE against Supabase Auth, documents through PostgREST, AI through the `ask`
   Edge Function (which holds the Claude key). Empty config = the app works exactly as before, on this device only.
   Backend in drawdown/backend/. Guests keep using localStorage; signing in moves this device's brews to the account. */
const SUPA = window.DRAWDOWN_SUPA || { url: 'https://iwevmoxaovmfofoiherd.supabase.co', key: 'sb_publishable_l1uOJuHK89BiwBw9S2jKAA_YqWFh-q1' }; /* publishable key: safe in the page, RLS does the guarding */
const AUTH_KEY = 'drawdown-auth', PKCE_KEY = 'drawdown-pkce';
const supa = {
  on: () => !!(SUPA.url && SUPA.key),
  session: (() => { try { return JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); } catch(e){ return null; } })(),
  note: '',
  email(){ return this.session?.user?.email || ''; },
  keep(s){ this.session = s; try { s ? localStorage.setItem(AUTH_KEY, JSON.stringify(s)) : localStorage.removeItem(AUTH_KEY); } catch(e){} },
  async signIn(){
    const raw = crypto.getRandomValues(new Uint8Array(32)), b64u = b => btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    const verifier = b64u(raw), challenge = b64u(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
    try { localStorage.setItem(PKCE_KEY, verifier); } catch(e){}
    const back = location.origin + location.pathname;
    location.href = `${SUPA.url}/auth/v1/authorize?provider=google&redirect_to=${encodeURIComponent(back)}&code_challenge=${challenge}&code_challenge_method=s256`;
  },
  /* back from Google: ?code=… (or ?error=…). Never show the raw error text from the URL. */
  async finishSignIn(){
    const u = new URL(location.href), code = u.searchParams.get('code'), err = u.searchParams.get('error') || u.searchParams.get('error_code');
    if(!code && !err) return;
    const desc = (u.searchParams.get('error_description') || '').toLowerCase();
    ['code','error','error_code','error_description','state'].forEach(k => u.searchParams.delete(k));
    history.replaceState(null, '', u.pathname + (u.search || '') + u.hash);
    if(err){ this.note = /not on the list|database error saving new user/.test(desc) ? 'That Google account isn’t on the list. Ask Jeroen to add it.' : 'Sign-in didn’t finish. Try again.'; return; }
    let verifier = ''; try { verifier = localStorage.getItem(PKCE_KEY) || ''; localStorage.removeItem(PKCE_KEY); } catch(e){}
    try {
      const r = await fetch(`${SUPA.url}/auth/v1/token?grant_type=pkce`, { method:'POST', headers:{ apikey: SUPA.key, 'Content-Type':'application/json' }, body: JSON.stringify({ auth_code: code, code_verifier: verifier }) });
      if(!r.ok) throw 0;
      this.keep(this.shape(await r.json()));
    } catch(e){ this.note = 'Sign-in didn’t finish. Try again.'; }
  },
  shape(j){ return { access_token: j.access_token, refresh_token: j.refresh_token, expires_at: j.expires_at || Math.floor(Date.now() / 1000) + (j.expires_in || 3600), user: { id: j.user?.id, email: j.user?.email } }; },
  async token(){
    const s = this.session; if(!s) return null;
    if(s.expires_at * 1000 > Date.now() + 60000) return s.access_token;
    const r = await fetch(`${SUPA.url}/auth/v1/token?grant_type=refresh_token`, { method:'POST', headers:{ apikey: SUPA.key, 'Content-Type':'application/json' }, body: JSON.stringify({ refresh_token: s.refresh_token }) }).catch(() => null);
    if(!r) throw { code:'offline' };
    if(!r.ok){ this.keep(null); return null; }
    this.keep(this.shape(await r.json())); return this.session.access_token;
  },
  async call(path, opts = {}){
    const t = await this.token(); if(!t) throw { code:'signed_out' };
    const r = await fetch(SUPA.url + path, { ...opts, headers:{ apikey: SUPA.key, Authorization: 'Bearer ' + t, 'Content-Type':'application/json', ...(opts.headers || {}) } });
    if(r.status === 401){ this.keep(null); throw { code:'signed_out' }; }
    if(!r.ok){ let j = null; try { j = await r.json(); } catch(e){} throw { code: r.status === 429 ? 'rate_limited' : r.status === 403 ? 'not_on_list' : 'http_' + r.status, reason: j && j.reason }; }
    return r.status === 204 || r.headers.get('content-length') === '0' ? null : r.json().catch(() => null);
  },
  async signOut(){
    try { await this.call('/auth/v1/logout', { method:'POST' }); } catch(e){}
    this.keep(null);
  }
};
/* documents live in public.docs (user_id, id, kind, data); RLS keeps each person to their own rows */
async function supaStore(){
  if(!supa.session) return null;
  const ok = await supa.call('/rest/v1/rpc/am_i_allowed', { method:'POST', body:'{}' }).catch(e => { if(e.code === 'offline') throw e; return false; });
  if(ok !== true){ await supa.signOut(); supa.note = 'That Google account isn’t on the list. Ask Jeroen to add it.'; return null; }
  const load = async () => (await supa.call('/rest/v1/docs?select=id,data&limit=5000') || []).map(r => ({ ...r.data, id: r.id }));
  const put = o => supa.call('/rest/v1/docs?on_conflict=user_id,id', { method:'POST', headers:{ Prefer:'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify({ id: o.id, kind: o.kind, data: o }) });
  let rows = await load();
  /* first sign-in on this device: bring the guest brews along (anything the account doesn't have yet) */
  let local = {}; try { local = JSON.parse(localStorage.getItem('brewlog-v1') || '{}'); } catch(e){}
  const have = new Set(rows.map(r => r.id)), fresh = Object.values(local).filter(d => d && d.id && d.kind && !have.has(d.id) && !(d.kind === 'prefs' && have.has('prefs')));
  if(fresh.length){
    for(let i = 0; i < fresh.length; i += 200){
      await supa.call('/rest/v1/docs?on_conflict=user_id,id', { method:'POST', headers:{ Prefer:'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify(fresh.slice(i, i + 200).map(o => ({ id: o.id, kind: o.kind, data: o }))) });
    }
    supa.moved = fresh.filter(d => d.kind === 'brew' || d.kind === 'bean').length;
    rows = await load();
  }
  return {
    mode:'supa',
    start(){
      clearTimeout(loadTimer); syncState = 'supa'; ingest(rows);
      /* pick up changes from the other phone when the app comes back */
      document.addEventListener('visibilitychange', async () => { if(document.visibilityState === 'visible' && store?.mode === 'supa' && !sheetOpen()){ try { ingest(await load()); } catch(e){} } });
    },
    put,
    del(id){ return supa.call(`/rest/v1/docs?id=eq.${encodeURIComponent(id)}`, { method:'DELETE' }); }
  };
}
/* AI through the `ask` function: same shape as Claude's `sample` capability (callable + .json) */
async function blobB64(b){ const buf = new Uint8Array(await b.arrayBuffer()); let s = ''; for(let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode(...buf.subarray(i, i + 0x8000)); return btoa(s); }
const AI_WHY = { credit:'The AI account is out of credit.', auth:'The AI key isn’t accepted.', rate:'The AI is busy right now.', busy:'The AI is busy right now.', network:'Couldn’t reach the AI.', model:'The AI model isn’t available.' };
function supaAI(){
  const ask = async (prompt, opts = {}) => {
    const images = await Promise.all((opts.images || []).slice(0, 1).map(i => typeof i === 'string' ? i.replace(/^data:[^,]+,/, '') : blobB64(i)));
    let r;
    try { r = await supa.call('/functions/v1/ask', { method:'POST', body: JSON.stringify({ prompt, images }) }); }
    catch(e){ throw e.code === 'rate_limited' ? { code:'rate_limited' } : e.code === 'http_503' ? { code:'unavailable' } : e.code === 'signed_out' ? { code:'signed_out' } : { code:'ai_failed', reason: e.reason, message: (AI_WHY[e.reason] || 'The AI didn’t answer.') + ' Try again, or fill it in by hand.' }; }
    return { text: (r && r.text) || '' };
  };
  const f = (p, o) => ask(p, o);
  f.json = async (p, o) => { const r = await ask(p, o); const m = r.text.match(/\{[\s\S]*\}/); if(!m) throw { code:'ai_failed', message:'The AI answer couldn’t be read. Try again.' }; return JSON.parse(m[0]); };
  f.web = true;
  return f;
}

/* ---------- lookups ---------- */
const setupById = id => S.setups.find(s => s.id === id);
const beanById = id => S.beans.find(b => b.id === id);
const brewById = id => S.brews.find(b => b.id === id);
function curSetup(){ return setupById(S.prefs.setupId) || S.setups[0] || null; }
function setupLabel(s){ if(!s) return 'No setup'; const g = grinderOf(s); return s.name || [s.brewer, g ? g.model : s.grinder].filter(Boolean).join(' · ') || 'Setup'; }
function setupGear(s){ const g = grinderOf(s); return [s.brewer, g ? gName(g) : s.grinder, s.kettle, s.filter].filter(Boolean).join(' · '); }
function setupText(s){ if(!s) return 'Unknown setup'; const g = grinderOf(s); return `Brewer: ${s.brewer||'?'}; Grinder: ${g ? gName(g) + ' (' + g.type + ')' : (s.grinder||'?')}; Kettle: ${s.kettle||'?'}; Filter: ${s.filter||'?'}; Notes: ${s.notes||'-'}`; }
function grindNote(s){
  const g = grinderOf(s);
  if(!g) return 'Give grind settings in the grinder’s own markings if you know this grinder; otherwise describe the grind (e.g. medium-fine, like table salt).';
  const z = gZone(g);
  return `Grind notation for the ${gName(g)}: ${gNotation(g)}. Pour-over range on this grinder: ${g.po[0]} to ${g.po[1]}${z ? `; a typical V60 zone is ${gStr(g, z.vlo)} to ${gStr(g, z.vhi)}` : ''}. Write every grind setting in exactly this notation.`;
}
function beanLabel(b){ return b ? (b.name || b.origin || 'Unnamed beans') : 'Pick your beans'; }

/* ---------- grinders ----------
   po = pour-over range in the grinder's own notation (Honest Coffee Guide grind chart).
   kind: steps = plain numbers/clicks; ode = Fellow 1–11 with two clicks between numbers;
   rot = 1Zpresso-style rotation.number.tick; text = notation we don't model, typed by hand.
   nudge = clicks that make a noticeable change (~30–40 µm) for quick tips. */
const GRINDERS = [
  // hand
  { id:'comandante-c40', brand:'Comandante', model:'C40 MK4', type:'hand', kind:'steps', min:0, max:50, step:1, unit:'clicks', po:['16','34'], nudge:1, alias:['c40'] },
  { id:'comandante-c40-red', brand:'Comandante', model:'C40 MK4 + Red Clix', type:'hand', kind:'steps', min:0, max:100, step:1, unit:'clicks', po:['31','68'], nudge:2, alias:['red clix','redclix'] },
  { id:'comandante-x25', brand:'Comandante', model:'X25 Trailmaster', type:'hand', kind:'steps', min:0, max:50, step:1, unit:'clicks', po:['16','34'], nudge:1, alias:['x25','trailmaster'] },

  } else if(Math.abs(e.s) <= .5){
    if(e.rating >= 4){ summary = 'That’s a good cup. Lock it in.'; changes.push('Brew it exactly the same again to confirm'); why = 'When a cup tastes right, repeat it before changing anything.'; }
    else if(e.rating && e.rating <= 2 && !e.sweet){ summary = 'Nothing tastes clearly off, but it’s flat. Push extraction a little.'; next.temp = temp((brew.temp || 93) + 2); changes.push(`Water 2° hotter (${next.temp}°C)`); why = 'A flat, muted cup often opens up with hotter water before you touch the grind.'; }
    else { summary = 'No clear extraction problem in your notes.'; changes.push('Keep these settings; add taste tags next time so I can steer'); why = 'Sour or thin means grind finer; bitter or drying means grind coarser.'; }
  } else {
    const under = e.s > 0, dir = under ? -1 : 1, word = under ? 'finer' : 'coarser';
    summary = under ? 'This cup reads under-extracted: it needs more from the coffee.' : 'This cup reads over-extracted: it took too much from the coffee.';
    const a = gi(brew.grind), bIdx = opp ? gi(opp.grind) : null;
    if(a != null && bIdx != null && Math.abs(a - bIdx) >= 2){
      next.grind = gStr(g, Math.round((a + bIdx) / 2));
      changes.push(`Grind halfway between this cup and your ${under ? 'over' : 'under'}-extracted one (${brew.grind} → ${next.grind})`);
      why = 'You’ve been on both sides of it. The sweet spot is in between.';
    } else if(sameDir >= 2 && brew.temp && ((under && brew.temp < 97) || (!under && brew.temp > 88))){
      next.temp = temp(brew.temp + (under ? 2 : -2));
      changes.push(`Keep the grind; water 2° ${under ? 'hotter' : 'cooler'} (${next.temp}°C)`);
      why = `You’ve already gone ${word} twice. Temperature is the next lever.`;
    } else {
      const steps = Math.abs(e.s) >= 2.2 ? 2 : 1;
      next.grind = shiftGrind(brew.grind, dir * steps, setup);
      changes.push(`Grind ${steps === 2 ? 'two steps' : 'one step'} ${word} (${brew.grind || '?'} → ${next.grind || word})`);
      if(e.time && under && e.time < e.target - 25) changes.push(`Aim for about ${fmtTime(e.target)}; this one ran fast (${fmtTime(e.time)})`);
      if(e.time && !under && e.time > e.target + 30) changes.push(`Aim for about ${fmtTime(e.target)}; this one ran slow (${fmtTime(e.time)})`);
      why = under ? 'Sour, thin or fast cups need more extraction: finer grind first, temperature second.' : 'Bitter, drying or slow cups need less extraction: coarser grind first, temperature second.';
    }
  }
  return { summary, next, changes, why, rule:true };
}

function loadImg(file){ return new Promise((res, rej) => { const u = URL.createObjectURL(file); const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('That photo couldn’t be opened. Try another one.')); i.src = u; }); }
function drawTo(img, max){ const r = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)); const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth*r); c.height = Math.round(img.naturalHeight*r); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); return c; }
const toBlob = (c, q) => new Promise(r => c.toBlob(r, 'image/jpeg', q));

/* ---------- sheet ---------- */
let sheetT = 0;
const reflow = el => void el.offsetWidth;
function restartAnim(el, cls){ if(!el) return; el.classList.remove(cls); reflow(el); el.classList.add(cls); }
function openSheet(title, html, opts = {}){
  const sh = $('#sheet'), sc = $('#scrim'), body = $('#sheet-body'), wasOpen = sh.classList.contains('open');
  clearTimeout(sheetT);
  $('#sheet-title').textContent = title; body.innerHTML = html;
  const sv = $('#sheet-save');
  if(opts.form){ sv.hidden = false; sv.textContent = opts.save || 'Save'; sv.setAttribute('form', opts.form); $('#sheet-close').textContent = 'Cancel'; }
  else { sv.hidden = true; sv.removeAttribute('form'); $('#sheet-close').textContent = 'Close'; }
  body.scrollTop = 0;
  if(wasOpen){ restartAnim(body, 'swap'); return; }
  body.classList.remove('swap');
  $('#view').style.transformOrigin = `50% ${window.scrollY + innerHeight / 2}px`;
  sh.classList.remove('closing', 'dragging'); sh.style.transform = '';
  sh.hidden = false; sc.hidden = false; reflow(sh);
  requestAnimationFrame(() => { sh.classList.add('open'); sc.classList.add('open'); document.body.classList.add('sheet-up'); });
  document.body.style.overflow = 'hidden';
}
function closeSheet(){
  const sh = $('#sheet'), sc = $('#scrim'); if(sh.hidden) return;
  sh.classList.add('closing'); sh.classList.remove('open', 'dragging'); sh.style.transform = '';
  sc.classList.remove('open', 'dragging'); sc.style.opacity = '';
  document.body.classList.remove('sheet-up'); document.body.style.overflow = '';
  clearTimeout(sheetT);
  sheetT = setTimeout(() => { sh.hidden = true; sc.hidden = true; $('#sheet-body').innerHTML = ''; sh.classList.remove('closing'); }, 420);
}
function sheetOpen(){ return $('#sheet').classList.contains('open'); }
$('#sheet-close').onclick = closeSheet; $('#scrim').onclick = closeSheet;
/* drag the sheet down to dismiss, with rubber-banding upwards */
(() => {
  const sh = $('#sheet'), sc = $('#scrim'), top = $('#sheet-top');
  let on = false, y0 = 0, dy = 0, ly = 0, lt = 0, v = 0;
  top.addEventListener('pointerdown', e => {
    if(e.target.closest('button') || !sheetOpen()) return;
    on = true; y0 = ly = e.clientY; lt = performance.now(); dy = 0; v = 0;
    sh.classList.add('dragging'); sc.classList.add('dragging'); top.setPointerCapture(e.pointerId);
  });
  top.addEventListener('pointermove', e => {
    if(!on) return;
    const now = performance.now(); v = (e.clientY - ly) / Math.max(1, now - lt); ly = e.clientY; lt = now;
    dy = e.clientY - y0;
    const over = -dy, dim = sh.offsetHeight, k = 0.55;
    const d = dy >= 0 ? dy : -(over * dim * k) / (dim + k * over);
    sh.style.transform = `translateY(${d}px)`;
    sc.style.opacity = String(Math.max(0, 1 - Math.max(0, dy) / sh.offsetHeight));
  });
  const end = () => {
    if(!on) return; on = false;
    sh.classList.remove('dragging'); sc.classList.remove('dragging');
    if(dy > 140 || (dy > 24 && v > 0.45)){
      /* hand the finger's speed to the close: faster flick, shorter slide */
      const left = sh.offsetHeight - dy, ms = Math.max(160, Math.min(400, v > 0 ? left / v : 400));
      sh.style.transitionDuration = ms + 'ms'; closeSheet(); setTimeout(() => { sh.style.transitionDuration = ''; }, ms + 40);
    }
    else { sh.style.transform = ''; sc.style.opacity = ''; }
  };
  top.addEventListener('pointerup', end); top.addEventListener('pointercancel', end);
})();
document.addEventListener('touchstart', () => {}, { passive:true }); /* lets iOS show :active press states */
function toast(msg){ const d = document.createElement('div'); d.className = 'grp tip'; d.innerHTML = '<span class="note"></span>'; d.firstChild.textContent = msg; $('#view').prepend(d); setTimeout(() => d.remove(), 5000); }
function toastErr(msg){ const d = document.createElement('div'); d.className = 'err'; d.textContent = msg; $('#view').prepend(d); setTimeout(() => d.remove(), 5000); }

}

}
const DK = { CLICK:3, DEAD:32, RANGE:200, STRETCH:8 };

    else if(k === 'Enter'){ e.preventDefault(); edit(); return; } else return;

    if(r.dataset.gid) return; // grind settings like 4.1 or 2.3.4 aren't typed numbers; drag or tap instead
    const inp = document.createElement('input');
    inp.className = 'dk-in'; inp.inputMode = 'decimal'; inp.setAttribute('enterkeyhint', 'done'); inp.setAttribute('aria-label', lab.textContent + ' value');

    let done = false;
    const finish = ok => { if(done) return; done = true;
      if(ok){ const t = r.dataset.unit === 'time' ? parseTime(inp.value) : parseFloat(String(inp.value).replace(',', '.')); if(t != null && !isNaN(t)) set(t); }

      </div></div>`;
  }
  return `<div class="gwrap" id="grind-wrap"><div class="frow"><label for="g-text">Grind${g ? ' · ' + esc(g.model) : ''}</label><input id="g-text" value="${esc(val ?? '')}" placeholder="${g ? 'e.g. ' + esc(g.po[0]) : 'Setting'}"></div>${g ? `<div class="ghint" style="padding:0 16px 10px">${esc(gHint(g))}</div>` : ''}</div>`;
}

/* ---------- timer ---------- */
const T = { start:0, acc:0, run:false, raf:0 };
function loop(){ paintTimer(); if(T.run) T.raf = requestAnimationFrame(loop); }

/* phases = bloom + pours + drawdown; the bar runs to the target time (or a bit past the last pour) */
function phases(p){
  const pours = pourPlan(p), last = pours[pours.length - 1], target = parseTime(p.targetTime) || 180;
  const list = [...pours, { label:'Drawdown', at: last.at + 30, drain:true }];
  return { list, target, total: Math.max(target, last.at + 45) };
}
const phaseIdx = (list, s) => { let k = 0; list.forEach((x, i) => { if(s >= x.at) k = i; }); return k; };

/* rolling counter: each digit is a doubled wheel strip that rolls like an odometer; a digit that goes

      const base = chars[i - 1] === ':' ? 6 : 10, run = Array.from({ length: base }, (_, d) => `<i>${d}</i>`).join('');

let heroK = null;
const grindTxt = (p, g) => p.grind ? (g && gUnit(g) ? p.grind + ' ' + gUnit(g) : 'G' + p.grind) : '';

function paintTimer(){
  const clock = $('#h-t'); if(!clock) return;
  const p = curPlan(), ph = phases(p), L = ph.list, ms = tNow(), s = ms / 1000, started = T.run || ms > 0;
  const tt = fmtTime(Math.floor(s)); if(T.run && clock.dataset.v && clock.dataset.v !== tt) SFX.second();
  rollTo(clock, tt);
  $('#h-f').style.transform = `scaleX(${Math.min(1, s / ph.total).toFixed(4)})`;
  const k = started ? phaseIdx(L, s) : -1, x = L[Math.max(0, k)], nx = L[k + 1];
  const st = setupById(p.setupId) || curSetup(), g = grinderOf(st);

  else if(!T.run) label = `Stopped at ${fmtTime(Math.floor(s))}`;
  else if(x.drain) label = `Drawdown · ${s < ph.target ? fmtTime(Math.ceil(ph.target - s)) + ' to target' : 'past target'}`;

  const tabs = document.querySelectorAll('#hdr .ttab'), tws = document.querySelectorAll('#hdr .tw');
  let dragged = false;
  const pick = i => {
    if(i === J.to && !J.moving){ (i ? $('#jr-scroll') : window).scrollTo({ top:0, behavior: reduceMotion() ? 'auto' : 'smooth' }); return; }
    if(i === J.to) return;
    SFX.tap(); i ? openJournal(JTAP, false) : closeJournal(JTAP, false);
  };
  tabs.forEach((t, i) => t.addEventListener('click', () => pick(i)));
  if(/iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) tws.forEach((w, i) => {
    // iOS only plays a haptic for a real finger on a native switch, so each title has one on top
    const sw = document.createElement('input'); sw.type = 'checkbox'; sw.className = 'hx'; sw.setAttribute('switch', ''); sw.setAttribute('aria-hidden', 'true'); sw.tabIndex = -1; w.appendChild(sw);
    sw.addEventListener('change', () => { sw.checked = false; if(dragged) return; pick(i); });
    sw.addEventListener('pointerdown', () => w.classList.add('pressed'));
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => sw.addEventListener(ev, () => w.classList.remove('pressed')));
  });
  addEventListener('scroll', jHairline, { passive:true }); $('#jr-scroll').addEventListener('scroll', jHairline, { passive:true });
  const onSize = () => { jMeasure(); paintJournal(); };
  addEventListener('resize', onSize); if(document.fonts && document.fonts.ready) document.fonts.ready.then(onSize);
  /* finger: axis-locked after 8 px, 1:1 with the grab, rubber band at the ends, momentum picks the page,
     the spring takes over the finger's speed. Light Ode ticks every 1/8 of the way, a firm one at halfway. */
  const project = (v, rate = .998) => (v / 1000) * rate / (1 - rate), rband = (x, d, c = .55) => (x * d * c) / (d + c * x);
  const N = 8, E = .06; let g = null, det = [], lastTick = 0, edge = false;
  const detents = (ts, raw) => {
    const x = jclamp(J.p, 0, 1) * N; let hit = 0, mid = false;
    for(let j = 1; j < N; j++){
      if(!det[j - 1] && x >= j + E){ det[j - 1] = true; hit = j; if(j === N / 2) mid = true; }
      else if(det[j - 1] && x <= j - E){ det[j - 1] = false; hit = j; if(j === N / 2) mid = true; }
    }
    if(hit && ts - lastTick >= 45){ lastTick = ts; if(mid) SFX.snap(); else SFX.tick(jclamp(J.p, 0, 1)); }
    const out = raw < 0 || raw > 1; if(out && !edge){ edge = true; SFX.end(); } else if(!out) edge = false;
  };
  const skip = el => el.closest('#sheet,#scrim,input,textarea,select,.dk,.dkrow,[data-noswipe]') && !el.closest('.hx');
  addEventListener('pointerdown', e => {
    if(e.button > 0 || !loaded || document.body.classList.contains('sheet-up') || skip(e.target)) return;
    dragged = false; const wasMoving = J.moving; if(J.moving) J.stop();
    g = { id:e.pointerId, x0:e.clientX, y0:e.clientY, p0:J.p, lock:null, hist:[{ x:e.clientX, t:e.timeStamp }], wasMoving };
  }, true);
  addEventListener('pointermove', e => {
    if(!g || e.pointerId !== g.id) return;
    const dx = e.clientX - g.x0, dy = e.clientY - g.y0;
    if(!g.lock){ if(Math.hypot(dx, dy) < 8) return;
      if(Math.abs(dx) > Math.abs(dy)){ g.lock = 'x'; dragged = true; try{ e.target.setPointerCapture(e.pointerId); }catch(_){}
        if(J.p < .5 && J.to === 0){ calAnim = true; paintJournalBody(); }
        J.moving = true; $('#view').inert = false;
        const x0 = jclamp(J.p, 0, 1) * N; det = Array.from({ length:N - 1 }, (_, i) => x0 >= i + 1); edge = false; lastTick = e.timeStamp; }
      else { g.lock = 'y'; return; } }
    if(g.lock !== 'x') return;
    g.hist.push({ x:e.clientX, t:e.timeStamp }); while(g.hist.length > 2 && e.timeStamp - g.hist[0].t > 100) g.hist.shift();
    const raw = g.p0 - dx / jW;
    J.p = raw < 0 ? -rband(-raw * jW, jW) / jW : raw > 1 ? 1 + rband((raw - 1) * jW, jW) / jW : raw;
    paintJournal(); detents(e.timeStamp, raw); e.preventDefault();
  }, { capture:true, passive:false });
  const release = (e, cancelled) => {
    if(!g || e.pointerId !== g.id) return; const was = g; g = null;
    if(was.lock === 'x'){
      const h = was.hist, a = h[0], b = h[h.length - 1];
      let v = h.length > 1 ? (b.x - a.x) / Math.max(1, b.t - a.t) * 1000 : 0;
      if(cancelled || e.timeStamp - b.t > 80) v = 0; v = jclamp(v, -4000, 4000);
      const to = jclamp(Math.round(J.p - project(v) / jW), 0, 1), opts = { ...JFLING, damping: Math.abs(v) > 300 ? JFLING.damping : 1, velocity: -v / jW };
      to ? openJournal(opts) : closeJournal(opts);
      // a swipe isn't a tap: swallow the click that follows it
      const eat = ev => { ev.stopPropagation(); ev.preventDefault(); }; addEventListener('click', eat, { capture:true, once:true });
      setTimeout(() => { removeEventListener('click', eat, { capture:true }); dragged = false; }, 60);
    } else if(was.wasMoving) jGo(J.to);
  };
  addEventListener('pointerup', e => release(e, false), true);
  addEventListener('pointercancel', e => release(e, true), true);
  addEventListener('keydown', e => { if(e.target.closest && e.target.closest('input,textarea,select') || document.body.classList.contains('sheet-up')) return;
    if(e.key === 'ArrowRight' && J.to === 0) pick(1); else if(e.key === 'ArrowLeft' && J.to === 1) pick(0); });
  jMeasure(); jSel(); paintJournal();
})();

const R3 = [['light','Light'],['medium','Medium'],['dark','Dark']];
const r3of = v => /light/.test(v) ? 'light' : /dark/.test(v) ? 'dark' : v ? 'medium' : '';
const PROC4 = [['washed','Washed'],['natural','Natural'],['fermented','Fermented'],['honey','Honey']];
function procFamily(p){ const m = String(p || '').toLowerCase().split('&')[0];
  return /anaerob|ferment|carbonic|experimental|thermal|maceration/.test(m) ? 'fermented' : /honey/.test(m) ? 'honey' : /natural/.test(m) ? 'natural' : /washed|wet/.test(m) ? 'washed' : ''; }
const POPULAR_ORIGINS = ['Ethiopia','Kenya','Colombia','Brazil','Rwanda','Burundi','Guatemala','Honduras','Costa Rica','Peru','Panama','El Salvador'];
/* what one label fact does to the recipe: compare with that fact neutral */
function recipeShift(a, b, g){
  if(!a || !b) return '';
  const out = [];
  if(g && g.kind !== 'text'){ const ia = gIdx(g, a.grind), ib = gIdx(g, b.grind); if(ia != null && ib != null && ia !== ib){ const c = Math.round((ia - ib) / (g.nudge || 1)) || Math.sign(ia - ib); out.push(`${Math.abs(c)} ${c < 0 ? 'finer' : 'coarser'}`); } }
  if(a.temp !== b.temp) out.push(`${a.temp > b.temp ? '+' : '−'}${Math.abs(a.temp - b.temp)}°`);
  if(a.water !== b.water) out.push(`${a.water > b.water ? '+' : '−'}${Math.abs(a.water - b.water)} g`);
  return out.join(' · ');
}

    </div>
    <p class="foot">Grind ranges come from the Honest Coffee Guide grind chart. They’re a starting point, since burrs and beans vary.</p>
    ${editId ? `<div class="grp" style="margin-top:20px"><button class="cell" type="button" data-act="delSetup" data-id="${editId}"><span class="c-title" style="color:var(--red)">Delete setup</span></button></div>` : ''}
  </form>`, { form:'setup-form' });
  $('#s-grinder').onchange = onGrinderPick;
  $('#setup-form').onsubmit = e => {
    e.preventDefault();
    const old = editId ? setupById(editId) : null, v = $('#s-grinder').value, g = GMAP[v];
    const other = $('#s-grinder-other').value.trim();
    const s = { ...(old || {}), id: editId || newId('setup'), kind:'setup', created: old?.created || Date.now(),
      name: $('#s-name').value.trim(), brewer: $('#s-brewer').value.trim(),
      grinderId: g ? g.id : null, grinder: g ? gName(g) : other, grinderType: g ? g.type : setupType,
      kettle: $('#s-kettle').value.trim(), filter: $('#s-filter').value.trim(), notes: $('#s-notes').value.trim() };
    save(s);
    if(!S.prefs.setupId || !setupById(S.prefs.setupId)) switchSetup(s.id);
    else if(S.prefs.setupId === s.id && old && old.grinderId !== s.grinderId) switchSetup(s.id);
    closeSheet();
  };
}
function onGrinderPick(){
  const v = $('#s-grinder').value, info = $('#s-ginfo');
  $('#s-other-row').hidden = v !== 'other';
  info.textContent = grinderInfo(GMAP[v]); restartAnim(info, 'swapin');
  const pv = $('#s-gprev'); if(pv){ pv.innerHTML = gImg(GMAP[v]); restartAnim(pv, 'swapin'); }
  if(v === 'other') setTimeout(() => $('#s-grinder-other').focus(), 50);
}
function switchSetup(id){
  const st = setupById(id), p = curPlan(), g = grinderOf(st);
  const grind = g && g.kind !== 'text' && gIdx(g, p.grind) == null ? gStart(st) : p.grind;
  save({ ...S.prefs, setupId:id, plan: { ...p, setupId:id, grind } });
}


/* ---------- settings ---------- */
function openSettings(){
  const where = syncState === 'cloud' ? 'Your Claude account' : syncState === 'supa' ? 'Your account' : syncState === 'local' ? 'This device' : 'Loading…';
  const acct = !window.claude && supa.on() ? (supa.session
    ? `<div class="cell"><span class="c-main"><span class="c-title">Signed in</span><span class="c-sub">${esc(supa.email())} · synced on every device you sign in on</span></span><button class="link" data-act="signOut">Sign out</button></div>`
    : `<div class="cell"><span class="c-main"><span class="c-title">Sign in to sync</span><span class="c-sub">Same brews on your phone and Mac, and AI reads the labels. Without it, everything stays on this device.</span></span><button class="link" data-act="signIn">Sign in with Google</button></div>`) : '';
  openSheet('Settings', `
    ${supa.note ? `<div class="err">${esc(supa.note)}</div>` : ''}
    ${acct ? `<div class="grp" style="margin-top:12px">${acct}</div>` : ''}
    <div class="grp" style="margin-top:12px">
      <div class="cell"><span class="c-main"><span class="c-title">Version</span></span><span class="c-val num">${esc(APP_VERSION)}</span></div>
      <div class="cell"><span class="c-main"><span class="c-title">Brews saved on</span></span><span class="c-val">${where}</span></div>
      <div class="cell"><span class="c-main"><span class="c-title">Photo reading</span></span><span class="c-val">${AI ? (AI.web ? 'AI (Claude, via your account)' : 'AI (Claude)') : 'On your phone'}</span></div>
      <div class="cell"><span class="c-main"><span class="c-title">Sounds</span><span class="c-sub">Slider ticks, timer, pour chimes.</span></span><button class="link" id="snd" data-act="sound" aria-pressed="${SFX.on}">${SFX.on ? 'On' : 'Off'}</button></div>
      <div class="cell"><span class="c-main"><span class="c-title">Play on silent</span><span class="c-sub">Sounds even with the mute switch on. Off: they follow it.</span></span><button class="link" id="snd-s" data-act="soundSilent" aria-pressed="${SFX.silent}">${SFX.silent ? 'On' : 'Off'}</button></div>
    </div>
    <div id="upd" style="margin-top:12px"><div class="btn-row"><button class="btn" data-act="checkUpdate">Check for update</button></div></div>
    <p class="foot">drawdown · ${[[S.brews.length,'brew'],[S.beans.length,'bean'],[S.setups.length,'setup']].map(([n,w]) => n + ' ' + w + (n === 1 ? '' : 's')).join(' · ')}</p>`);
}
async function checkUpdate(){
  const box = $('#upd'); if(!box) return;
  box.innerHTML = '<div class="grp tip"><span class="note"><span class="spin"></span>Checking…</span></div>';
  try {
    const r = await fetch(location.pathname + '?v=' + Date.now(), { cache:'no-store' });
    const live = ((await r.text()).match(/const APP_VERSION = '([^']+)'/) || [])[1];
    if(!live) throw new Error('no version');
    if(live === APP_VERSION) box.innerHTML = '<div class="grp tip"><span class="note">You’re on the latest version.</span></div>';
    else box.innerHTML = `<div class="grp tip"><span class="note">Version ${esc(live)} is out.</span></div><div class="btn-row"><button class="btn go" data-act="reloadApp">Update now</button></div>`;
  } catch(e){
    box.innerHTML = '<div class="grp tip"><span class="note">Couldn’t check right now. Close and reopen the app to get the latest version.</span></div>';
  }
}

/* ---------- actions ---------- */
function armDelete(btn, fn){
  if(btn.dataset.armed){ fn(); return; }
  btn.dataset.armed = '1'; const t = btn.querySelector('.c-title') || btn; const old = t.textContent; t.textContent = 'Tap again to delete';
  setTimeout(() => { if(btn.isConnected){ delete btn.dataset.armed; t.textContent = old; } }, 3000);
}
const ACT = {
  timerToggle(){
    if(T.run) stopTimer(false);
    else { T.start = Date.now(); T.run = true; document.body.classList.add('timing'); T.raf = requestAnimationFrame(loop); }
    T.run ? SFX.start() : SFX.stop(); flow.step = 3; render(); },
  timerStop(){ stopTimer(false); SFX.stop(); goStep(4); },
  soundSilent(){ SFX.setSilent(!SFX.silent); const b = $('#snd-s'); if(b){ b.textContent = SFX.silent ? 'On' : 'Off'; b.setAttribute('aria-pressed', String(SFX.silent)); } },
  sound(){ SFX.set(!SFX.on); const b = $('#snd'); if(b){ b.textContent = SFX.on ? 'On' : 'Off'; b.setAttribute('aria-pressed', String(SFX.on)); } },
  timerSkip(){ if(!T.run) return; const L = phases(curPlan()).list, nx = L[phaseIdx(L, tNow() / 1000) + 1]; if(!nx) return; T.acc = nx.at * 1000; T.start = Date.now(); paintTimer(); },
  timerReset(){ stopTimer(true); flow.step = 3; render(); },
  step(i){ goStep(+i); },
  pickBean(id){ const p = curPlan(); flow.noBean = false; const n = S.setups.length ? 2 : 1; flow.step = n; setPlan({ ...p, beanId: id }, p.source); goStep(n); },
  noBean(){ flow.noBean = true; goStep(S.setups.length ? 2 : 1); },
  pickSetup(id){ flow.step = 2; switchSetup(id); goStep(2); },
  useRecipe(){ goStep(3); },
  tRate(i){ taste.rating = taste.rating === +i ? 0 : +i; document.querySelectorAll('#t-rating button').forEach((b, k) => { const on = k < taste.rating; if(on && !b.classList.contains('on')) setTimeout(() => restartAnim(b, 'pop'), k * 35); b.classList.toggle('on', on); }); },
  tTag(t, btn){ const on = taste.tags.includes(t); taste.tags = on ? taste.tags.filter(x => x !== t) : [...taste.tags, t]; btn.classList.toggle('on', !on); btn.setAttribute('aria-pressed', String(!on)); },
  tLog(){
    const p = curPlan(), st = setupById(p.setupId) || curSetup(), ms = tNow();
    const b = { id: newId('brew'), kind:'brew', date: new Date().toISOString(), setupId: st?.id || null, beanId: p.beanId || null,
      dose:p.dose, water:p.water, grind:p.grind, temp:p.temp, bloomWater:p.bloomWater, bloomTime:p.bloomTime,
      time: ms > 0 ? Math.round(ms / 1000) : null, rating: taste.rating, tags: [...taste.tags], notes: taste.notes.trim(), advice:null };
    stopTimer(true); resetFlow(); save(b); if(S.prefs.plan) save({ ...S.prefs, plan:null });
    openBrewDetail(b.id, true); },
  tMore(){ openBrewForm({ ...curPlan(), time: tNow() > 0 ? Math.round(tNow() / 1000) : null, rating: taste.rating, tags: taste.tags, notes: taste.notes }); },
  logTimed(){ openBrewForm({ ...curPlan(), time: Math.round(tNow()/1000) }); },
  newBrew(){ openBrewForm({ ...curPlan(), time: tNow() > 10000 ? Math.round(tNow()/1000) : null }); },
  again(id){ const b = brewById(id) || S.brews[0]; if(!b) return; setPlan({ ...brewFrom(b), targetTime: b.time ? fmtTime(b.time) : '3:00' }, 'Brewing again: ' + fmtDate(b.date)); goBrew(); },
  editPlan(){ openPlanForm(); },
  clearPlan(){ save({ ...S.prefs, plan:null }); },
  seg(id){
    if(jseg === id) return; jseg = id; calAnim = true;
    const s = $('.seg'); if(!s) return render();
    s.dataset.on = id; s.querySelectorAll('button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.id === id)));
    const jb = $('#jbody'); jb.innerHTML = journalBody(); restartAnim(jb, 'swap'); },
  calMove(d){ calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + +d, 1); calSel = null; calAnim = true; const jb = $('#jbody'); if(jb) jb.innerHTML = journalBody(); },
  calDay(k){ calSel = k && calSel !== k ? k : null; const jb = $('#jbody'); if(jb) jb.innerHTML = journalBody(); },
  brew(id){ openBrewDetail(id); },
  editBrew(id){ const b = brewById(id); if(b) openBrewForm(b, id); },
  delBrew(id, btn){ armDelete(btn, () => { remove('brew', id); closeSheet(); }); },
  advise(id){ getAdvice(id); },
  useAdvice(id){ const b = brewById(id); if(!b?.advice) return; const n = b.advice.next || {};
    setPlan({ setupId:b.setupId, beanId:b.beanId, dose:n.dose ?? b.dose, water:n.water ?? b.water, grind:n.grind ?? b.grind, temp:n.temp ?? b.temp, bloomWater:n.bloomWater ?? b.bloomWater, bloomTime:n.bloomTime ?? b.bloomTime, targetTime:n.targetTime || '3:00' }, b.advice.rule ? 'Quick tip from your notes' : 'AI suggestion from your notes'); goBrew(); },
  rate(i, btn){ draftBrew.rating = draftBrew.rating === +i ? 0 : +i; document.querySelectorAll('#f-rating button').forEach((b, k) => { const on = k < draftBrew.rating; if(on && !b.classList.contains('on')) setTimeout(() => restartAnim(b, 'pop'), k * 35); b.classList.toggle('on', on); }); },
  tag(t, btn){ const on = draftBrew.tags.includes(t); draftBrew.tags = on ? draftBrew.tags.filter(x => x !== t) : [...draftBrew.tags, t]; btn.classList.toggle('on', !on); btn.setAttribute('aria-pressed', String(!on)); },
  scan(){ const c = $('#cam'); c.value = ''; c.click(); },
  pick(){ const c = $('#pick'); c.value = ''; c.click(); },
  readLabel(id, btn){ readLabel(btn); },
  scanManual(){ const j = scanJob; openBeanForm(j ? { photo: j.thumb } : {}); },
  addBean(){ openBeanForm({}); },
  bean(id){ openBeanDetail(id); },
  editBean(id){ const b = beanById(id); if(b) openBeanForm(b, id); },
  delBean(id, btn){ armDelete(btn, () => { remove('bean', id); closeSheet(); }); },
  beanRecipe(id){ beanRecipe(id); },
  beanRoast(id, btn){ changeBean(id, { roastLevel: btn.dataset.v, roastBy: 'you', roastFrom: '' }); },
  beanProc(id, btn){ changeBean(id, { process: PROC4.find(p => p[0] === btn.dataset.v)[1], procBy: 'you' }); },
  beanOrigin(id){ beanEdit = beanEdit === 'origin' ? null : 'origin'; refreshBeanDetail(id); },
  originPick(id, btn){ const i = $('#o-in'); if(!i) return; i.value = btn.dataset.v; btn.parentNode.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === btn)); },
  originClear(id){ beanEdit = null; changeBean(id, { origin: '' }); },
  brewBean(id){ const b = beanById(id), st = curSetup(), r = st && b?.recipes?.[st.id]; if(!r) return;
    setPlan({ setupId: st.id, beanId: id, dose:r.dose, water:r.water, grind:r.grind, temp:r.temp, bloomWater:r.bloomWater, bloomTime:r.bloomTime, targetTime:r.targetTime || '3:00' }, 'Suggested recipe for ' + beanLabel(b)); goBrew(); },
  addSetup(){ openSetupForm({}); },
  editSetup(id){ const s = setupById(id); if(s) openSetupForm(s, id); },
  useSetup(id){ switchSetup(id); },
  settings(){ openSettings(); },
  journal(){ openJournal(); },
  journalClose(){ closeJournal(); },
  signIn(){ supa.signIn(); },
  async signOut(){ await supa.signOut(); location.replace(location.pathname + location.hash); },
  checkUpdate(){ checkUpdate(); },
  reloadApp(){ location.replace(location.pathname + '?v=' + Date.now() + location.hash); },
  gtype(t){
    if(setupType === t) return; setupType = t;
    const s = $('#gtype'); s.dataset.on = t === 'electric' ? 'top' : 'all'; s.querySelectorAll('button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.id === t)));
    const sel = $('#s-grinder'), cur = sel.value; sel.innerHTML = grinderOptions(t, cur === 'other' ? 'other' : GRINDERS.find(g => g.type === t).id); onGrinderPick(); },
  delSetup(id, btn){ armDelete(btn, () => { remove('setup', id); if(S.prefs.setupId === id) save({ ...S.prefs, setupId: S.setups[0]?.id || null }); closeSheet(); }); }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b || b.disabled) return;
  const f = ACT[b.dataset.act]; if(!f) return;
  e.preventDefault(); if(!['timerToggle','timerStop','sound','soundSilent'].includes(b.dataset.act)) SFX.tap(); f(b.dataset.id, b, e);
});
$('#cam').addEventListener('change', e => { const f = e.target.files?.[0]; if(f) onPhoto(f); });
$('#pick').addEventListener('change', e => { const f = e.target.files?.[0]; if(f) onPhoto(f); });

/* ---------- boot ---------- */
route();
(async () => {
  loadTimer = setTimeout(() => { if(!loaded) fallBack('Couldn’t reach your synced data. Saving on this device for now.'); }, 10000);
  const [db, user] = await Promise.all([use('db'), use('user')]);
  if(fellBack) return;
  if(db && user){ try { const cs = await cloudStore(db, user); if(cs){ store = cs; cs.start(); return; } } catch(e){} }
  /* web version with an account set up: finish a Google sign-in, then sync */
  if(!window.claude && supa.on()){
    await supa.finishSignIn();
    if(supa.session){
      try { const ss = await supaStore(); if(fellBack) return; if(ss){ store = ss; AI = AI || supaAI(); ss.start(); if(supa.moved) toast(`Moved ${supa.moved} brews and beans from this phone to your account.`); return; } }
      catch(e){ clearTimeout(loadTimer); return fallBack('Couldn’t reach your account. Saving on this device for now.'); }
      AI = AI && AI.web ? null : AI;
    }
    if(supa.note){ clearTimeout(loadTimer); fallBack(''); return setTimeout(openSettings, 400); }
  }
  clearTimeout(loadTimer); fallBack('');
})();
</script>
</body>
